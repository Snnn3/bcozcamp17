services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bcozcamp17
      POSTGRES_USER: bcoz
      POSTGRES_PASSWORD: bcoz_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcoz -d bcozcamp17"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bcoz_dev_access
      MINIO_ROOT_PASSWORD: bcoz_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
