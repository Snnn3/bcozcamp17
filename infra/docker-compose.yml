services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bcozcamp17
      POSTGRES_USER: bcoz
      POSTGRES_PASSWORD: bcoz_dev_password
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcoz -d bcozcamp17"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bcoz_dev_access
      MINIO_ROOT_PASSWORD: bcoz_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: bcoz_dev_access
      MINIO_ROOT_PASSWORD: bcoz_dev_secret
      STORAGE_BUCKET: bcoz-private
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        do sleep 1; done;
        mc mb --ignore-existing "local/$$STORAGE_BUCKET";
        mc anonymous set none "local/$$STORAGE_BUCKET";

volumes:
  postgres-data:
  minio-data:
