name: CI

on:
  push:
    branches: [main, setup]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bcoz:bcoz_dev_password@localhost:5432/bcozcamp17
      BCOZ_SEED_MODE: synthetic
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bcoz
          POSTGRES_PASSWORD: bcoz_dev_password
          POSTGRES_DB: bcozcamp17
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bcoz -d bcozcamp17"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed synthetic database data
        run: npm run db:seed

      - name: Run required checks
        run: npm run check
